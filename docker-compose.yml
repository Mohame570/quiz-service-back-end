services:
  postgres:
    image: postgres:16-alpine
    container_name: quiz-service-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quiz_service}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-quiz_service}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: quiz-service-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
